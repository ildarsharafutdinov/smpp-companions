# companion.* configuration (AD-17 fail-fast matrix — Story 1.3). The role×mode cell is encoded
# STRUCTURALLY in the property path: populate EXACTLY ONE of
#   companion.forward.mode-a | companion.forward.mode-c
#   companion.reverse.mode-a | companion.reverse.mode-b | companion.reverse.mode-c
# (forward×B is forbidden — there is no companion.forward.mode-b node, SEC-051 is structural). Zero or
# more-than-one branch => the app refuses to start (AD-17). ignoreUnknownFields=false means a typo'd
# companion.* key also fails loudly (fail-closed, AD-11). The common keys below (bind/memory/tls) apply
# to every cell and ship defaults; the per-cell operator material (secrets, routing, SMSC, OIDC, trust
# store, Mode B ack) is supplied via env/args under the chosen branch.
spring:
  main:
    # Fail-safe: stay NON-web even if a webflux/web starter ever leaks onto the classpath (AD-16).
    web-application-type: none
    # Story 4.1 (FR-OBS-2): stdout is a JSON-lines log stream — the ASCII banner would be the one
    # non-JSON line an operator's log shipper chokes on. Off.
    banner-mode: 'off'
  lifecycle:
    # Per-phase ceiling for SmartLifecycle.stop() — bounds the future AD-22 shutdown window (AC8).
    timeout-per-shutdown-phase: 30s

# Story 4.1 (FR-OBS-2): PDU bodies are TRACE-gated and OFF by default. The relay's body logger is
# addressable through the standard logging.level.* keys — uncomment for a debugging session (bodies
# then appear as one JSON line per relayed PDU; the bind family stays redacted, so the password
# never crosses at any level):
# logging:
#   level:
#     smpp.companion.proxy.relay.pdu: TRACE

companion:
  # --- COMMON (required by every cell; defaulted here) -----------------------------------
  bind:
    # The proxy's own SMPP listener port (SEC-055).
    port: 2775
    # The listener's bind address (F13, Story 3.3): the reverse's internet leg (TLS in A/C, plaintext
    # direct in B) or the forward's trusted leg. 0.0.0.0 = all interfaces (the pre-3.3 behavior); a
    # loopback/interface-scoped value is the F13 hardening — an internet-leg listener SHOULD be scoped
    # to the interface it is reachable on.
    host: 0.0.0.0
    # Bind-adjudication budget (Story 2.2 T7): RequestContext.deadline = now + this, handed to the
    # BindCredentialVerifier via the ScopedValue (AD-5/AD-12). 4s = the PERF-3-flavored bind-latency
    # budget; zero/negative refuses startup (compact-ctor guard). The relay-side timeout arm is RELAY-020.
    adjudication-deadline: 4s

  # AD-30 direct-memory budget. PROBLEM IT SOLVES: Netty allocates SMPP PDU buffers off-heap (direct
  # memory); without a deliberate -XX:MaxDirectMemorySize cap the process OOMs at scale rather than
  # degrading. The cap is derived: MaxDirectMemorySize = SmppFrame.MAX_COMMAND_LENGTH (the codec's fixed
  # max-frame, RELAY-026 — used directly, NOT a config key) × max-inbound-depth × concurrent-pairs ×
  # safety-factor. Only the three tunable inputs are operator-set here.
  memory:
    max-inbound-depth: 64
    # Budget input AND the F13 accepted-connection cap (Story 3.3 review rework — one number): every
    # accepted connection can become a budgeted coupled pair, so the acceptor reads this directly
    # (RelayServerLifecycle/ConnectionCapHandler); there is no separate bind.max-connections knob.
    concurrent-pairs: 1024
    safety-factor: 1.5
    # Over-ceiling policy for the AD-30 live startup self-check (NOT a budget-formula input). "fail"
    # (the shipped default): the derived budget exceeding the JVM's live direct-memory ceiling refuses
    # startup (AD-17 fail-fast). "warn": log a loud accepted-risk banner and start (the Mode B pattern)
    # — for deliberately under-provisioned deployments whose real load stays far below the formula's
    # worst case. The check treats any non-warn value as fail; there is no value that skips the check.
    budget-check: fail

  tls:
    # AD-34: protocols (1.3 preferred, 1.2 allowed). TLS floor is 1.2 (SEC-061).
    protocols:
      - TLSv1.3
      - TLSv1.2
    # AD-34: TLS 1.2 — the four ECDHE / AES-GCM suites (no CBC / static-RSA / RC4 / 3DES).
    tls12-cipher-suites:
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    # AD-34: TLS 1.3 set.
    tls13-cipher-suites:
      - TLS_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256
      - TLS_CHACHA20_POLY1305_SHA256

  # Story 4.1 (FR-OBS-1): the read-only Prometheus /metrics endpoint. The bind address is NOT a
  # key — the endpoint binds the literal 127.0.0.1 (loopback IPv4 is its sole authentication; a
  # non-loopback exposure cannot be misconfigured into existence). Absent node = endpoint stays
  # down (programmatic fixtures); this default keeps production observable. Scrapes are GET-only,
  # exact-path, and mutate nothing.
  metrics:
    port: 9090

  # --- BRANCHES (populate EXACTLY ONE; all examples below are commented) ------------------
  # Every secret is a FILE PATH (AD-18); secrets never ship in-repo, so all branch material is
  # operator-supplied via env/args. Uncomment one block per instance.
  #
  # forward:  (NO OIDC — trusted-side relay; the reverse role adjudicates. AD-12 amended 2026-08-18.
  #            [B] topology, Story 3.3: the forward's listener is the PLAINTEXT trusted leg; it DIALS the
  #            reverse per SMPP session over TLS. NO server cert on this role.)
  #   mode-a:                       # per-session one-way TLS dial; SMSC NOT required (SEC-097)
  #     trust-store: { path: /run/secrets/truststore.p12, password: changeit }   # anchors the reverse's server cert
  #     routing:                    # 1:1 (AD-29): system_id allow-list -> the reverse's dial target
  #       - system-id: carrierOne
  #         host: reverse.internal
  #         port: 2776
  #         # tls-context-id: primary     # optional (AD-29) — selects a forward.tls-contexts override
  #   mode-c:                       # per-session mTLS dial = forward-A material + per-instance client cert
  #     client-cert: { cert-path: /run/secrets/forward-client.crt, key-path: /run/secrets/forward-client.key }
  #     trust-store: { path: /run/secrets/truststore.p12, password: changeit }
  #     routing: [ { system-id: carrierOne, host: reverse.internal, port: 2776 } ]
  #   # AD-29 per-target client-cert overrides (optional): id -> client cert+key presented on dials
  #   # whose routing entry carries tls-context-id: <id>. Absent id on an entry = the instance-level
  #   # default (mode-c's own client cert; trust-only in mode-a). Forward-scoped: only the forward
  #   # dials TLS ([B] topology). Example:
  #   tls-contexts:
  #     primary:
  #       cert-path: /run/secrets/forward-client-primary.crt
  #       key-path: /run/secrets/forward-client-primary.key
  #
  # reverse:  (performs OIDC — sole enforcement point before the SMSC; every reverse cell adjudicates.
  #            Modes describe the INTERNET leg listener; the SMSC leg is always plaintext/trusted.
  #            [B]: the reverse HOLDS the TLS listener — the forward dials in.)
  #   mode-a:                       # internet leg, one-way TLS listener (presents the server cert; validates no peers)
  #     smsc: { host: smsc.carrier.example, port: 2775 }
  #     server-cert: { cert-path: /run/secrets/reverse-server.crt, key-path: /run/secrets/reverse-server.key }
  #     oidc:                       # reverse performs OIDC (AD-12); provider-url MUST be https (SEC-053/054)
  #       provider-url: https://idp.example.com/realms/smpp-companions
  #       client-id: smpp-client-confidential
  #       client-secret-path: /run/secrets/oidc-client-secret   # sole provider client auth (AD-18; the
  #                                  # RFC 8705 client-mtls-keystore arm was removed pre-release, 2026-08-19)
  #       trust-store: { path: /run/secrets/idp-truststore.p12, password: changeit }   # never cacerts (AD-13)
  #       # The two adapter budgets (required keys; values below are the documented defaults):
  #       timeout: 4s               # OIDC_TIMEOUT: per provider call, keep within 2s..5s (PERF-3) and
  #                                  # <= companion.bind.adjudication-deadline — not validated, an operator contract
  #       max-in-flight: 64         # concurrent-adjudication admission cap (AD-28(4)); saturated -> fail-closed
  #                                  # DenyIndeterminate WITHOUT a wire call; a rejection threshold, not a queue
  #       # JWT-only adjudication (Story 3.4 T1, 2026-08-27): the token endpoint must issue JWT access
  #       # tokens — an opaque (non-JWT) token response denies fail-closed (DenyIndeterminate + WARN, D6);
  #       # there is no second-arm fallback. Remediation: configure the client/realm to issue JWT
  #       # access tokens.
  #       # TLS-as-sole-trust-anchor (Story 3.4 T2, 2026-08-27): the provider link is the sole trust
  #       # anchor — no local JWT signature verification, no cached provider keys. The former third
  #       # budget key (the key-cache TTL) is REMOVED; a config still carrying it refuses startup
  #       # (ignoreUnknownFields=false, and the binder's unknown-field error names it — loud).
  #       # Startup discovery REMOVED (Story 3.4 T9, 2026-08-29 — "simplify app"): the proxy makes
  #       # NO provider wire call at startup. The token endpoint is DERIVED from provider-url as
  #       # <provider-url>/protocol/openid-connect/token — provider-url MUST therefore be the
  #       # Keycloak REALM base (e.g. https://idp.example.com/realms/smpp-companions), not the
  #       # provider host root. The retired startup posture (the OIDC discovery-document fetch,
  #       # the issuer-equality check, and the Direct-Access-Grants warning) is gone; its
  #       # prerequisites are now an OPERATOR CONTRACT: Direct Access Grants (the password grant)
  #       # is per-client and OFF by default since Keycloak 26.2 — enable it on the client, or
  #       # every bind denies fail-closed at FIRST BIND via the unchanged verdict mapping, with a
  #       # starred operator WARN naming the derived token endpoint and provider-url.
  #   mode-b:                       # PLAINTEXT internet leg, direct client->reverse (no forward proxy);
  #                                 # opt-in ack REQUIRED to start (SEC-052) — still adjudicates ("plaintext+ROPC")
  #     smsc: { host: smsc.carrier.example, port: 2775 }
  #     acknowledged: true
  #     oidc: { provider-url: https://idp.example.com/realms/smpp-companions, client-id: smpp-client-confidential,
  #             client-secret-path: /run/secrets/oidc-client-secret,
  #             trust-store: { path: /run/secrets/idp-truststore.p12, password: changeit },
  #             timeout: 4s, max-in-flight: 64 }
  #   mode-c:                       # internet leg, mTLS listener = server cert + trust store REQUIREing the
  #                                 # forward's per-instance client cert (AD-13: REQUIRE never WANT)
  #     smsc: { host: smsc.carrier.example, port: 2775 }
  #     server-cert: { cert-path: /run/secrets/reverse-server.crt, key-path: /run/secrets/reverse-server.key }
  #     trust-store: { path: /run/secrets/truststore.p12, password: changeit }
  #     oidc: { provider-url: https://idp.example.com/realms/smpp-companions, client-id: smpp-client-confidential,
  #             client-secret-path: /run/secrets/oidc-client-secret,
  #             trust-store: { path: /run/secrets/idp-truststore.p12, password: changeit },
  #             timeout: 4s, max-in-flight: 64 }
