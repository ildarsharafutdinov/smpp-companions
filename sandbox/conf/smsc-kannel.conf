# curl "http://127.0.0.1:14000/status?password=test"
group = core
admin-port = 14000
admin-password = test
smsbox-port = 14001
dlr-storage = pgsql
log-level = 4

include = "/etc/kannel/db.conf"

group = dlr-db
id = pg
table = smsc_bearer_dlr
field-smsc = smsc
field-timestamp = timestamp
field-destination = destination
field-source = source
field-service = service
field-url = url
field-mask = mask
field-status = status
field-boxc-id = boxc_id

group = smsc
smsc = fake
smsc-id = FAKE1
host = host.docker.internal
port = 10004
log-level = 4

# MO routing — T3 (not in the ported source: the playground never routed MOs). Kannel's bearerbox
# broadcasts MOs only to boxes WITHOUT a boxc-id; opensmppbox registers as `usr1`
# (use-systemid-as-smsboxid), so without an explicit smsbox-route every fakesmsc-injected MO dies in
# the queue with `WARNING: smsbox_list empty!`. This group routes FAKE1's MO traffic to the
# opensmppbox connection, making the deliver_sm journey (README §6) possible at all.
group = smsbox-route
smsbox-id = usr1
smsc-id = FAKE1

# Inert on this side: no smsbox runs among the SMSC-side containers (bearerbox, opensmppbox,
# fakesmsc only) — this group is ported documentation, never read here. The sendsms HTTP entry
# point it describes is the FRONT side's (front-sms-box :8080 — README §6.1's journey):
#   curl "http://localhost:8080/cgi-bin/sendsms?user=user&pass=password&dlr-mask=31&from=79876543210&coding=0&to=79033374423&text=hello"
group = smsbox
smsbox-id = usr1
bearerbox-host = host.docker.internal
bearerbox-port = 14002
sendsms-port = 8080
log-level = 4