# curl "http://127.0.0.1:13000/status.txt?password=test"
group = core
admin-port = 13000
admin-password = test
smsbox-port = 13001
dlr-storage = pgsql
log-level = 4

include = "/etc/kannel/db.conf"

group = dlr-db
id = pg
table = front_bearer_dlr
field-smsc = smsc
field-timestamp = timestamp
field-destination = destination
field-source = source
field-service = service
field-url = url
field-mask = mask
field-status = status
field-boxc-id = boxc_id

group = smsc
smsc = smpp
smsc-id = smsc1
smsc-username = usr1
smsc-password = pwd1
system-type = smsc1
host = host.docker.internal
port = 2775
transceiver-mode = true
interface-version = 34

# route — the ONE delta from the ported example: this smsc group dials the host-run PROXY
# (host.docker.internal:2775) instead of opensmppbox (:14567) directly; the proxy's egress
# then dials the published opensmppbox port. The proxy launch recipe is in sandbox/README.md.
#
# [smsbox:8080] --> [sqlbox:13002] <-> [front bearerbox:13001] ==SMPP==> [PROXY host:2775]
# [PROXY egress] ==SMPP==> [opensmppbox:14567] <-> [SMSC bearerbox:14001] <-> [fakesmsc FAKE1:10004]
# <----------------- FRONT (compose) -----------------><- host proxy -><-------- SMSC (compose) -------->

# curl "http://localhost:8080/cgi-bin/sendsms?user=user&pass=password&dlr-mask=31&from=79876543210&coding=0&to=79033374423&text=hello"
group = smsbox
smsbox-id = smsbox1
bearerbox-host = host.docker.internal
bearerbox-port = 13002
sendsms-port = 8080
global-sender = "+79876543210"
log-level = 4

group = sendsms-user
username = user
password = password
default-smsc = smsc1
