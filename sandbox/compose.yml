# The Kannel sandbox rig (Story 6.3) — ported from the proven pre-project playground
# (/home/ildar/Documents/smpp-sandbox). Deltas from the source are exactly: the explicit
# project name below, the build path (self-contained sandbox/ layout), the front SMSC
# re-point in conf/front-kannel.conf (host.docker.internal:2775 — the host-run proxy), and
# the MO-routing smsbox-route group in conf/smsc-kannel.conf (T3 — without it the bearerbox
# queues every injected MO with `smsbox_list empty!`; README §6.2/§10).
# Every inter-service hop hairpins through the host (host.docker.internal + the published
# ports) — that is the ported pattern that lets the host-run proxy sit in the chain.
# Added by T2 on top of the ported 7: the keycloak service (the ROPC adjudication the
# reverse cell requires, AD-17 fail-closed — no auth-bypass exists) + its committed material
# under keycloak/ (realm export + fixture-tier PKI); the proxy launch recipe is README §5.
# Story 8.2 (2026-09-20) adds the ninth service: prometheus, the rig's metrics consumer —
# it scrapes the proxy's loopback-only /metrics from the host namespace (the pattern was
# proven live BEFORE the service landed; the service comment below is the story).
name: smpp-bmad-sandbox

services:
  pg:
    image: postgres:latest
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 1s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  front-bearer-box:
    build: ./kannel
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl \"http://127.0.0.1:13000/status.txt?password=test\"" ]
      interval: 2s
      timeout: 1s
      retries: 5
    ports:
      - 13000:13000
      - 13001:13001
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/kannel:ro
    command: [ /usr/local/kannel/sbin/bearerbox, /etc/kannel/front-kannel.conf ]

  front-sql-box:
    build: ./kannel
    depends_on:
      front-bearer-box:
        condition: service_healthy
    ports:
      - 13002:13002
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/kannel:ro
    command: [ /usr/local/kannel/sbin/sqlbox, /etc/kannel/front-sqlbox.conf ]

  front-sms-box:
    build: ./kannel
    depends_on:
      - front-sql-box
    ports:
      - 8080:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/kannel:ro
    command: [ /usr/local/kannel/sbin/smsbox, /etc/kannel/front-kannel.conf ]

  smsc-bearer-box:
    build: ./kannel
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl \"http://127.0.0.1:14000/status.txt?password=test\"" ]
      interval: 2s
      timeout: 1s
      retries: 5
    ports:
      - 10004:10004
      - 14000:14000
      - 14001:14001
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/kannel:ro
    command: [ /usr/local/kannel/sbin/bearerbox, /etc/kannel/smsc-kannel.conf ]

  smsc-opensmpp-box:
    build: ./kannel
    depends_on:
      smsc-bearer-box:
        condition: service_healthy
    ports:
      - 14567:14567
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./conf:/etc/kannel:ro
    command: [ /usr/local/kannel/sbin/opensmppbox, /etc/kannel/smsc-opensmppbox.conf ]

  smsc-fake-smsc:
    build: ./kannel
    depends_on:
      smsc-bearer-box:
        condition: service_healthy
    stdin_open: true
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    command: [ sh, -c, /usr/local/kannel/sbin/fakesmsc -H host.docker.internal -r 10004 ]

  # The ROPC adjudicator (T2). Mirrors the test-tier KeycloakContainer's verified launch
  # (quay.io/keycloak/keycloak:26.7.0 — the ≥26.7.0 pin of the 3.1 verdict; `start
  # --import-realm --hostname-strict=false`; the fixture server cert/key with SANs
  # localhost/keycloak/127.0.0.1; the realm import) with two deliberate posture deltas:
  # (1) KC_HTTPS_CLIENT_AUTH stays unset — the production proxy's IdP SSLContext is
  # trust-ONLY (it presents no client cert toward the provider; client auth is the ROPC
  # client_secret), unlike the test slice which additionally presents the fixture client
  # cert; (2) the admin env uses the KC 26 bootstrap spelling (KC_BOOTSTRAP_ADMIN_*) — the
  # fixture's KEYCLOAK_ADMIN works but logs a deprecation warning on every boot. The realm
  # export deliberately carries NO client secret: Keycloak generates one at import, fetched
  # once into the gitignored sandbox/secrets/oidc-client-secret (AD-18) — README §5.
  # No kannel service depends on it: its only consumer is the host-run proxy (the front's
  # bind credentials ride the ROPC password grant at every bind, AD-12).
  # Healthcheck = TCP-connect to the HTTPS listener only: the rig's Keycloak is HTTPS-only
  # (KC_HTTP_ENABLED=false), KC 26.7 serves the management interface over TLS as well
  # (http-management-enabled notwithstanding — verified live), and the image ships no
  # TLS-capable client (no curl); realm READINESS is asserted by the README §5 discovery
  # curl, which the secret-bootstrap step runs anyway.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: [ start, --import-realm, --hostname-strict=false ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HOSTNAME: localhost
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server-key.pem
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443" ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    ports:
      - 8443:8443
    volumes:
      - ./keycloak/certs/server.pem:/opt/keycloak/conf/server.pem:ro
      - ./keycloak/certs/server-key.pem:/opt/keycloak/conf/server-key.pem:ro
      - ./keycloak/certs/truststore.p12:/opt/keycloak/conf/truststore.p12:ro
      - ./keycloak/realm-smpp-companions.json:/opt/keycloak/data/import/realm-smpp-companions.json:ro

  # Story 8.2 — the rig's Prometheus (fixture scope, addendum A7): the always-on consumer
  # of the proxy's /metrics. It reaches the AD-19 loopback-only endpoint by JOINING the
  # host network namespace — network_mode: host — the namespace BOTH supported proxy
  # postures run in (the host-run README §5.2 jar and the runbooks' --network host
  # containers), so the scrape targets in prometheus/prometheus.yml are the literals
  # 127.0.0.1:9090 and 127.0.0.1:9091 (9090 = every first instance's yml-default metrics
  # port; 9091 = the two-instance runbooks' second instance — ALWAYS configured per the
  # owner Q3 decision, so a single-instance rig simply shows that target DOWN until a
  # second instance launches). Access comes from namespace sharing only — never from bind
  # widening or port publishing — and the product §13 "no metrics dashboard / telemetry
  # backend" non-goal stands: this is rig fixture, not product.
  # Deliberately NO ports: entry — the service is already in the host namespace, so the
  # web UI binds 127.0.0.1:9095 directly (9090/9091 are the proxies'; 9093 is the
  # Alertmanager convention), and compose silently IGNORES ports under network_mode: host
  # anyway (a ports block would only mislead readers). Image pinned exactly — the Keycloak
  # 26.7.0 precedent. TSDB lives on the named volume below with a 24h retention: dev rig,
  # no durability promise. The README §5.5 bridge-variant proxy is NOT reachable this way
  # (its /metrics stays inside the container's own loopback — DEPLOY-011 posture; a
  # documented variant limitation, not fixed here).
  prometheus:
    image: prom/prometheus:v3.14.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=127.0.0.1:9095
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-tsdb:/prometheus

volumes:
  prometheus-tsdb:
